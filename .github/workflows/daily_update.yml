name: Daily Market Pulse Update

on:
  schedule:
    # 每天台北時間 21:00 (UTC 13:00) 自動執行
    - cron: '0 13 * * *'
  workflow_dispatch: # 支援手動按鈕觸發

jobs:
  update-market-pulse:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run update script
        run: python update_data.py
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH: ${{ secrets.FIREBASE_AUTH }}

      - name: Commit and push updated index.html
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html
          if git diff --staged --quiet; then
            echo "沒有檢測到靜態頁面變更，跳過 Commit。"
          else
            git commit -m "chore: auto-update market pulse data [skip ci]"
            git push
          fi
